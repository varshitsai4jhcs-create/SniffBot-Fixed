workflows:
  ios-debug-build:
    name: iOS Debug IPA Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Unzip Project Files
        script: |
          #!/bin/bash
          echo "Looking for your uploaded ZIP file..."
          ZIP_FILE=$(find . -name "*.zip" -print -quit)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ERROR: No zip file found in the repository root!"
            exit 1
          fi
          
          echo "Found file: $ZIP_FILE. Extracting now..."
          unzip "$ZIP_FILE"
          rm "$ZIP_FILE"
      - name: Force Strip Internal Package Registry Configuration
        script: |
          #!/bin/bash
          echo "Hunting for internal project configuration mapping structures..."
          PBXPROJ_FILE=$(find . -name "project.pbxproj" -print -quit)
          
          if [ -z "$PBXPROJ_FILE" ]; then
            echo "❌ ERROR: project.pbxproj file not found!"
            exit 1
          fi
          
          echo "Found configuration file at: $PBXPROJ_FILE"
          
          echo "Scrubbing internal SPM registry scopes..."
          # This command strips any line containing 'registry' or 'median' inside your core Xcode blueprint
          sed -i.bak '/median/d' "$PBXPROJ_FILE"
          sed -i.bak '/registryConfig/d' "$PBXPROJ_FILE"
          
          echo "Forcing a clean slate on resolved packages..."
          find . -name "Package.resolved" -exec rm -f {} + 2>/dev/null || true
          
          echo "Configuration scrub complete!"
      - name: Compile App Binary
        script: |
          #!/bin/bash
          PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          cd "$PROJECT_DIR"
          
          echo "Compiling native app files..."
          xcodebuild -project *.xcodeproj \
                     -scheme SniffBot \
                     -configuration Debug \
                     -sdk iphoneos \
                     -derivedDataPath build_output \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     clean build
      - name: Package App Into IPA Archive
        script: |
          #!/bin/bash
          PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          cd "$PROJECT_DIR"
          
          echo "Creating Payload structure..."
          mkdir -p Payload
          
          echo "Locating compiled app bundle..."
          APP_BUNDLE=$(find build_output -name "SniffBot.app" -type d -print -quit)
          
          if [ -z "$APP_BUNDLE" ]; then
            echo "❌ ERROR: Compilation finished but the app bundle was not built!"
            exit 1
          fi
          
          echo "Copying $APP_BUNDLE to payload folder..."
          cp -R "$APP_BUNDLE" Payload/
          
          echo "Zipping app into final IPA archive..."
          zip -r ../../SniffBot.ipa Payload
    artifacts:
      - "*.ipa"
