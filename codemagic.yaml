workflows:
  ios-debug-build:
    name: iOS Debug IPA Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Unzip Project Files
        script: |
          #!/bin/bash
          echo "Looking for your uploaded ZIP file..."
          ZIP_FILE=$(find . -name "*.zip" -print -quit)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ERROR: No zip file found in the repository root!"
            exit 1
          fi
          
          echo "Found file: $ZIP_FILE. Extracting now..."
          unzip "$ZIP_FILE"
          rm "$ZIP_FILE"
      - name: Compile Native Workspace Files
        script: |
          #!/bin/bash
          echo "Hunting for workspace structure path..."
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -print -quit)
          
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "❌ ERROR: No .xcworkspace file found!"
            exit 1
          fi
          
          echo "Found workspace layout configuration at: $WORKSPACE_PATH"
          WORKSPACE_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORKSPACE_DIR"
          
          echo "Compiling native workspace core..."
          xcodebuild -workspace *.xcworkspace \
                     -scheme SniffBot \
                     -configuration Debug \
                     -sdk iphoneos \
                     -derivedDataPath build_output \
                     -scmProvider system \
                     -disableAutomaticPackageResolution \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     clean build
      - name: Package App Into IPA Archive
        script: |
          #!/bin/bash
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -print -quit)
          WORKSPACE_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORKSPACE_DIR"
          
          echo "Creating Payload structure..."
          mkdir -p Payload
          
          echo "Locating compiled app bundle..."
          APP_BUNDLE=$(find build_output -name "SniffBot.app" -type d -print -quit)
          
          if [ -z "$APP_BUNDLE" ]; then
            echo "❌ ERROR: Compilation finished but the app bundle was not built!"
            exit 1
          fi
          
          echo "Copying $APP_BUNDLE to payload folder..."
          cp -R "$APP_BUNDLE" Payload/
          
          echo "Zipping app into final IPA archive..."
          zip -r ../../SniffBot.ipa Payload
    artifacts:
      - "*.ipa"
